# ---------------------------------------------------------------------------
# "OrdererOrgs" - Definition of organizations managing orderer nodes
# ---------------------------------------------------------------------------
OrdererOrgs:
  - Name: Orderer
    Domain: erupi.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer

# ---------------------------------------------------------------------------
# "PeerOrgs" - Definition of organizations managing peer nodes
# ---------------------------------------------------------------------------
PeerOrgs:
  # -------------------------------------------------------------------------
  # Org1: GovernmentBankMSP (Hosts Government and Bank application roles)
  # -------------------------------------------------------------------------
  - Name: Org1
    Domain: org1.erupi.com
    EnableNodeOUs: true
    Template:
      Count: 1
    Users:
      Count: 1

  # -------------------------------------------------------------------------
  # Org2: MerchantAuditorMSP (Hosts Merchant and Auditor application roles)
  # -------------------------------------------------------------------------
  - Name: Org2
    Domain: org2.erupi.com
    EnableNodeOUs: true
    Template:
      Count: 1
    Users:
      Count: 1
